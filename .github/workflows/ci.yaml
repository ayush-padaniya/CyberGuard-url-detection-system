name: CyberGuard CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout code ──
      - name: Checkout Code
        uses: actions/checkout@v3

      # ── Step 2: Setup Python ──
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # ── Step 3: Install dependencies ──
      - name: Install Dependencies
        run: |
          pip install -r requirements-ci.txt
          pip install -e .
          echo "Dependencies installed"

      # ── Step 4: Configure AWS credentials ──
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # ── Step 5: DVC Pull ──
      - name: DVC Pull
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ secrets.AWS_REGION }}
        run: |
          dvc pull
          echo "DVC pull completed"

      # ── Step 6: Run DVC Pipeline ──
      - name: Run DVC Pipeline
        env:
          DAGSHUB_USERNAME:      ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN:         ${{ secrets.DAGSHUB_TOKEN }}
          S3_BUCKET_NAME:        ${{ secrets.S3_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ secrets.AWS_REGION }}
        run: |
          dvc repro
          echo "DVC pipeline completed"

      # ── Step 7: Login to Amazon ECR ──
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # ── Step 8: Build Docker image ──
      - name: Build Docker Image
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          echo "Docker image built successfully"

      # ── Step 9: Tag Docker image ──
      - name: Tag Docker Image
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          echo "Image tagged successfully"

      # ── Step 10: Push to ECR ──
      - name: Push to Amazon ECR
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          echo "Image pushed to ECR successfully"

      # ── Step 11: Print image URI ──
      - name: Print Image URI
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          echo "Image URI: $ECR_REGISTRY/$ECR_REPOSITORY:latest"