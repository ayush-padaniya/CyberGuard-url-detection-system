name: CyberGuard CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout code ──
      - name: Checkout Code
        uses: actions/checkout@v3

      # ── Step 2: Setup Python ──
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # ── Step 3: Install dependencies ──
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
          echo "Dependencies installed"

      # ── Step 4: Configure AWS credentials ──
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # ── Step 5: DVC Pull ──
      - name: DVC Pull
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ secrets.AWS_REGION }}
        run: |
          dvc pull
          echo "DVC pull completed"

      # ── Step 6: Run DVC Pipeline ──
      - name: Run DVC Pipeline
        env:
          DAGSHUB_USERNAME:      ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN:         ${{ secrets.DAGSHUB_TOKEN }}
          S3_BUCKET_NAME:        ${{ secrets.S3_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ secrets.AWS_REGION }}
        run: |
          dvc repro
          echo "DVC pipeline completed"

      # ── Step 7: Login to Amazon ECR ──
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # ── Step 8: Build Docker image ──
      - name: Build Docker Image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REGISTRY }}:latest .

      # ── Step 9: Tag Docker image ──
      - name: Tag Docker Image
        run: |
          docker tag ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REGISTRY }}:latest \
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REGISTRY }}:${{ github.sha }}

      # ── Step 10: Push to ECR ──
      - name: Push to Amazon ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REGISTRY }}:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REGISTRY }}:${{ github.sha }}

      # ── Step 11: Print image URI ──
      - name: Print Image URI
        run: |
          echo "Image URI: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REGISTRY }}:latest"

  # ══════════════════════════════════════════
  #           CD — Deploy to EC2
  # ══════════════════════════════════════════
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # ── Step 1: Checkout code ──
      - name: Checkout Code
        uses: actions/checkout@v3

      # ── Step 2: Setup SSH key ──
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/cyberguard-key.pem
          chmod 600 ~/.ssh/cyberguard-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # ── Step 3: Deploy to EC2 ──
      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/cyberguard-key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            # ── Set environment variables ──
            export DAGSHUB_USERNAME="${{ secrets.DAGSHUB_USERNAME }}"
            export DAGSHUB_TOKEN="${{ secrets.DAGSHUB_TOKEN }}"
            export S3_BUCKET_NAME="${{ secrets.S3_BUCKET_NAME }}"
            export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
            export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            export AWS_REGION="${{ secrets.AWS_REGION }}"
            export AWS_DEFAULT_REGION="${{ secrets.AWS_REGION }}"
            export GF_SECURITY_ADMIN_PASSWORD="${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}"

            # ── Login to ECR ──
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            # ── Go to project folder ──
            cd ~/CyberGuard-url-detection-system

            # ── Pull latest code ──
            git pull origin main

            # ── DVC pull to get data ──
            dvc pull

            # ── Pull latest Docker image ──
            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REGISTRY }}:latest

            # ── Restart containers ──
            docker-compose down
            docker-compose up -d

            echo "Deployment completed successfully!"
          EOF