name: CyberGuard CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout code ──
      - name: Checkout Code
        uses: actions/checkout@v3

      # ── Step 2: Setup Python ──
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # ── Step 3: Install dependencies ──
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install dvc dvc-s3
          pip install -e .

      # ── Step 4: Configure AWS credentials ──
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # ── Step 5: Setup environment variables ──
      - name: Setup Environment Variables
        run: |
          echo "MLFLOW_TRACKING_USERNAME=${{ secrets.DAGSHUB_USERNAME }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.DAGSHUB_TOKEN }}" >> $GITHUB_ENV
          echo "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" >> $GITHUB_ENV

      # ── Step 6: DVC Pull (get all tracked files from S3) ──
      - name: DVC Pull
        run: |
          dvc pull
          echo "DVC pull completed"

      # ── Step 7: Run DVC Pipeline ──
      - name: Run DVC Pipeline
        run: |
          dvc repro
          echo "DVC pipeline completed"

      # ── Step 8: Login to Amazon ECR ──
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # ── Step 9: Build Docker image ──
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.ECR_REPOSITORY }} .
          echo "Docker image built successfully"

      # ── Step 10: Tag Docker image ──
      - name: Tag Docker Image
        run: |
          docker tag ${{ secrets.ECR_REPOSITORY }}:latest \
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest
          docker tag ${{ secrets.ECR_REPOSITORY }}:latest \
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      # ── Step 11: Push to ECR ──
      - name: Push to Amazon ECR
        run: |
          docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest
          docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
          echo "Image pushed to ECR successfully"

      # ── Step 12: Print image URI ──
      - name: Print Image URI
        run: |
          echo "Image URI: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest"